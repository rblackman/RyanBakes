name: Dependabot auto-merge

# Turns on squash auto-merge for Dependabot patch and minor updates, so they
# land once every required check passes. Major updates are left for a person
# to review, as AGENTS.md asks. No approval step: the main ruleset requires
# zero approvals, so auto-merge alone is enough.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  automerge:
    name: Enable auto-merge (patch/minor)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Check the PR author, not github.actor: github.actor is whoever triggered
    # this run, so a person re-running it on a Dependabot PR would also match.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'rblackman/RyanBakes' }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # Pinned to a commit because this step gets a token that can merge.
        # Dependabot's github-actions updates keep the SHA and comment current.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # update-type is the largest bump in the PR, so a grouped PR with one
      # major update in it is left for review too. Only an explicit patch or
      # minor bump qualifies; an unknown update type is left for review.
      - name: Enable auto-merge (squash)
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      # Also runs when the metadata step failed, so the run says why nothing merged.
      - name: Leave for review
        if: ${{ !cancelled() && steps.metadata.outputs.update-type != 'version-update:semver-patch' && steps.metadata.outputs.update-type != 'version-update:semver-minor' }}
        env:
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: echo "::notice title=Needs review::Not auto-merged (${UPDATE_TYPE:-unknown update type}). Updates $DEPS"
