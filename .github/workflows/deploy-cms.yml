name: Deploy CMS

# Deploys the Sanity Studio (and, as part of `sanity deploy`, its schema) to
# Sanity hosting. Runs on every push to main that can change the Studio build,
# and by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "apps/cms/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-cms.yml"
      - ".github/actions/setup/**"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A push that lands while a deploy runs waits, and
# GitHub keeps only the newest waiting run, so the last merge always deploys.
concurrency:
  group: deploy-cms
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + Deploy Sanity Studio
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only deploy from main, and never from a fork.
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'rblackman/RyanBakes' }}

    # Holds SANITY_AUTH_TOKEN. If this environment requires a reviewer, every
    # automatic deploy waits for that approval.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node + pnpm
        uses: ./.github/actions/setup

      # Same order as CI: extract -> typegen -> build -> deploy. Typegen needs
      # no secrets, and a schema or query error stops the deploy here.
      - name: Typegen (schema extract + sanity typegen)
        run: pnpm run typegen

      - name: Build CMS
        run: pnpm run build:cms

      # --no-build reuses the build above. --yes keeps the CLI from waiting on
      # a prompt. The target studio comes from deployment.appId in
      # apps/cms/sanity.cli.ts, so nothing needs choosing.
      - name: Deploy CMS
        run: pnpm --filter cms exec sanity deploy --no-build --yes
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
