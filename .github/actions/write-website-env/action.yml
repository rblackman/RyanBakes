name: "Write website .env for CI"
description: "Validates required environment variables and writes apps/website/.env"
inputs:
  next_public_base_url:
    description: "NEXT_PUBLIC_BASE_URL"
    required: true
  next_public_sanity_dataset:
    description: "NEXT_PUBLIC_SANITY_DATASET"
    required: true
  next_public_sanity_key:
    description: "NEXT_PUBLIC_SANITY_KEY"
    required: true
  recipes_page_key:
    description: "RECIPES_PAGE_KEY"
    required: true
  site_config_key:
    description: "SITE_CONFIG_KEY"
    required: true
  tags_page_key:
    description: "TAGS_PAGE_KEY"
    required: true
  sanity_revalidate_secret:
    description: "SANITY_REVALIDATE_SECRET"
    required: true
  next_public_sanity_studio_url:
    description: "NEXT_PUBLIC_SANITY_STUDIO_URL"
    required: true
  sanity_viewer_token:
    description: "SANITY_VIEWER_TOKEN"
    required: true

runs:
  using: "composite"
  steps:
    # Values are passed through env (never interpolated into the script) so a
    # value containing shell metacharacters can't change what the script does.
    - name: Validate required inputs and write apps/website/.env
      shell: bash
      env:
        NEXT_PUBLIC_BASE_URL: ${{ inputs.next_public_base_url }}
        NEXT_PUBLIC_SANITY_DATASET: ${{ inputs.next_public_sanity_dataset }}
        NEXT_PUBLIC_SANITY_KEY: ${{ inputs.next_public_sanity_key }}
        RECIPES_PAGE_KEY: ${{ inputs.recipes_page_key }}
        SITE_CONFIG_KEY: ${{ inputs.site_config_key }}
        TAGS_PAGE_KEY: ${{ inputs.tags_page_key }}
        SANITY_REVALIDATE_SECRET: ${{ inputs.sanity_revalidate_secret }}
        NEXT_PUBLIC_SANITY_STUDIO_URL: ${{ inputs.next_public_sanity_studio_url }}
        SANITY_VIEWER_TOKEN: ${{ inputs.sanity_viewer_token }}
      run: |
        set -euo pipefail

        names=(
          NEXT_PUBLIC_BASE_URL
          NEXT_PUBLIC_SANITY_DATASET
          NEXT_PUBLIC_SANITY_KEY
          RECIPES_PAGE_KEY
          SITE_CONFIG_KEY
          TAGS_PAGE_KEY
          SANITY_REVALIDATE_SECRET
          NEXT_PUBLIC_SANITY_STUDIO_URL
          SANITY_VIEWER_TOKEN
        )

        missing=0
        for name in "${names[@]}"; do
          if [ -z "${!name}" ]; then
            echo "::error title=Missing CI variable::${name} is empty. Set it as a repository variable or secret (Dependabot PRs read Dependabot secrets, not Actions secrets)."
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi

        : > apps/website/.env
        for name in "${names[@]}"; do
          printf '%s=%s\n' "$name" "${!name}" >> apps/website/.env
        done
        echo "Wrote apps/website/.env with ${#names[@]} variables."
